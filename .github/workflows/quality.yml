name: Quality

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level filters (not workflow paths-ignore) so docs/marketing PRs still
  # get Site source build, while docs/social/chore-only changes skip Jest,
  # app typecheck/lint, and Edge Function tests.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
      site: ${{ steps.detect.outputs.site }}
      edge: ${{ steps.detect.outputs.edge }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          write_outputs() {
            echo "app=$1" >> "$GITHUB_OUTPUT"
            echo "site=$2" >> "$GITHUB_OUTPUT"
            echo "edge=$3" >> "$GITHUB_OUTPUT"
          }

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "No usable base commit; running the full Quality suite."
            write_outputs true true true
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [[ ! -s "$RUNNER_TEMP/changed-files.txt" ]]; then
            echo "No changed files; skipping expensive Quality jobs."
            write_outputs false false false
            exit 0
          fi

          echo "Changed files:"
          cat "$RUNNER_TEMP/changed-files.txt"

          # Prefix/suffix regex so nested paths match (bash case globs like
          # doc_web_interne/* and *.md do not). Skip the full gate only when
          # every changed file is docs/social/chore content.
          docs_social_or_chore='^(doc_web_interne/|marketing/|docs-src/|docs/|data/.+\.json$|.*\.mdx?$)'

          if grep -Evq "$docs_social_or_chore" "$RUNNER_TEMP/changed-files.txt"; then
            app=true
            echo "App/code paths changed; running Jest and PR quality."
          else
            app=false
            echo "Docs/social/chore-only changes; skipping Jest and PR quality."
          fi

          if grep -Eq '^(\.github/workflows/quality\.yml|docs-src/|docs/|data/|scripts/|package(-lock)?\.json$)' \
            "$RUNNER_TEMP/changed-files.txt"; then
            site=true
            echo "Site-related files changed; running the site build."
          else
            site=false
            echo "No site-related files changed; skipping the site build."
          fi

          if grep -Eq '^(\.github/workflows/quality\.yml|supabase/|deno\.lock$)' \
            "$RUNNER_TEMP/changed-files.txt"; then
            edge=true
            echo "Edge Function paths changed; running Deno checks."
          else
            edge=false
            echo "No Edge Function paths changed; skipping Deno checks."
          fi

          write_outputs "$app" "$site" "$edge"

  edge-functions:
    name: Edge Functions check and tests
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
          cache: true

      - name: Check API Edge Function
        working-directory: supabase/functions
        run: deno check --frozen api/index.ts

      - name: Test API Edge Function
        working-directory: supabase/functions
        run: deno test --frozen --allow-env api

  site-build:
    name: Site source build and checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Check site
        run: npm run docs:check

  pr-quality:
    name: PR typecheck, lint and changed tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck:app

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Enforce warning-free active scripts
        run: npm run lint:scripts

      - name: Test files changed since the PR base
        env:
          JEST_CHANGED_SINCE: ${{ github.event.pull_request.base.sha }}
        run: npm run test:changed

  test-fast:
    name: Full fast test suite
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest and capture timing JSON
        run: |
          mkdir -p artifacts
          npm run test:fast -- --json --outputFile=artifacts/jest-results.json

      - name: Download latest successful master baseline
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('artifacts/jest-results.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t run_ids < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow quality.yml \
              --branch master \
              --event push \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId' 2>/dev/null || true
          )

          for run_id in "${run_ids[@]}"; do
            rm -rf artifacts/baseline
            mkdir -p artifacts/baseline
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name jest-timing \
              --dir artifacts/baseline 2>/dev/null; then
              echo "Downloaded Jest baseline from master run ${run_id}."
              exit 0
            fi
          done

          echo "No unexpired Jest baseline artifact was found on master."

      - name: Enforce the 20% duration budget
        if: ${{ always() && hashFiles('artifacts/jest-results.json') != '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node ./scripts/check-jest-duration-regression.js --allow-missing-baseline
          else
            node ./scripts/check-jest-duration-regression.js
          fi

      - name: Upload Jest JSON timing
        if: ${{ always() && hashFiles('artifacts/jest-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jest-timing
          path: artifacts/jest-results.json
          if-no-files-found: error
          retention-days: 90
