# Production Release integration: real email login, microphone-driven transcript,
# authenticated save and analysis, then logout. A QA tester or a validated audio
# input route must speak the documented French sentinel once dictation starts.
appId: com.tanuki75.noctalia
name: Release authenticated voice transcription and analysis
tags:
  - release
  - auth
  - voice
  - analysis
onFlowComplete:
  - runFlow:
      when:
        visible:
          text: "Mettre en pause"
      commands:
        - tapOn:
            id: btn.recordToggle
  - setAirplaneMode: disabled
  - setPermissions:
      permissions:
        all: allow
---
- setAirplaneMode: disabled
- pressKey: back
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 20000
- runFlow: subflows/dismiss-first-launch-onboarding.yml

# Prove the flow starts as a guest, then authenticate with the local QA account.
- openLink: noctalia://settings
- extendedWaitUntil:
    visible: "Settings|Paramètres|Configuración|Ajustes|Impostazioni|Einstellungen"
    timeout: 30000

# Make the spoken sentinel deterministic regardless of the device locale. The
# speech recognizer follows the explicit app language selected here, and the QA
# phone has the corresponding offline model installed.
- scrollUntilVisible:
    element:
      id: settings-language-choice
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
- tapOn:
    id: settings-language-choice
- extendedWaitUntil:
    visible:
      id: settings-language-choice.sheet
    timeout: 10000
- tapOn:
    id: settings-language-choice.option.fr
- extendedWaitUntil:
    notVisible:
      id: settings-language-choice.sheet
    timeout: 30000

- scrollUntilVisible:
    element:
      id: settings-account-open-signin
    direction: UP
    visibilityPercentage: 60
    timeout: 30000
- assertVisible:
    id: settings-account-open-signin
- assertNotVisible:
    id: btn.auth.signOut
- runFlow: subflows/sign-in-email-qa.yml

# Opening the native recognizer starts the manual audio window.
- tapOn:
    id: tab.addDream
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- scrollUntilVisible:
    element:
      id: btn.recordToggle
    direction: DOWN
    timeout: 20000
- tapOn:
    id: btn.recordToggle

# Require two ordered semantic anchors from the French QA sentence. This
# prevents a microphone timer or a stale text field from being accepted as
# transcription.
- extendedWaitUntil:
    visible: "(?i).*(for[eê]t|lune).*(renard|porte).*"
    timeout: 45000
- tapOn:
    id: btn.recordToggle
- extendedWaitUntil:
    visible: "(?i).*(for[eê]t|lune).*(renard|porte).*"
    timeout: 15000

# Save and analyze only after the microphone-derived transcript is visible.
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 90000
- tapOn:
    id: btn.dream.primaryCta
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: screen.recording
    timeout: 180000
- scrollUntilVisible:
    element:
      text: "Interpretation|Interprétation|Interpretación|Interpretazione|Deutung"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
- assertVisible: "Interpretation|Interprétation|Interpretación|Interpretazione|Deutung"
- scrollUntilVisible:
    element:
      id: component.transcriptCard
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
- assertVisible:
    id: component.transcriptCard
- assertVisible: "(?i).*(for[eê]t|lune).*(renard|porte).*"

# End in a clean guest state.
- openLink: noctalia://settings
- extendedWaitUntil:
    visible: "Settings|Paramètres|Configuración|Ajustes|Impostazioni|Einstellungen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: btn.auth.signOut
    direction: DOWN
    visibilityPercentage: 70
    timeout: 30000
- tapOn:
    id: btn.auth.signOut
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 60000
- openLink: noctalia://settings
- extendedWaitUntil:
    visible: "Settings|Paramètres|Configuración|Ajustes|Impostazioni|Einstellungen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: settings-account-open-signin
    direction: UP
    visibilityPercentage: 60
    timeout: 30000
- assertVisible:
    id: settings-account-open-signin
- assertNotVisible:
    id: btn.auth.signOut
