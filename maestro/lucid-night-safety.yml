# Ensure the bundle identifier matches the local Lucid Trainer dev build.
appId: com.tanuki75.noctalia.lucid
---
# The five-step onboarding walker never asks for audio safety, which is exactly
# the state the Night gate exists for.
- runFlow: subflows/open-lucid-app.yml
- runFlow: subflows/complete-lucid-onboarding.yml

- tapOn:
    id: lucid-tab-night
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-night
    timeout: 20000

# Disabled, and saying why: audio safety was never accepted and the playback
# route was never confirmed. The consent switch itself is present and off.
- assertVisible:
    id: lucid-night-start
- assertVisible: "Start night signals|Démarrer les signaux|Iniciar señales|Nachtsignale starten|Avvia segnali"
- assertVisible: ".*Still required.*|.*Encore nécessaire.*|.*Aún necesario.*|.*Noch nötig.*|.*Ancora necessario.*"
- assertVisible: ".*accept audio safety.*|.*accepter la sécurité audio.*|.*aceptar la seguridad de audio.*|.*Audio-Sicherheit bestätigen.*|.*accettare la sicurezza audio.*"
- scrollUntilVisible:
    element:
      id: lucid-night-audio-safety
    direction: DOWN
- assertVisible:
    id: lucid-night-audio-safety

# Pressing Start must schedule nothing: no active plan, no stop button, no exit.
- tapOn:
    id: lucid-night-start
- waitForAnimationToEnd
- assertVisible:
    id: lucid-night
- assertVisible:
    id: lucid-night-start
- assertVisible: ".*Still required.*|.*Encore nécessaire.*|.*Aún necesario.*|.*Noch nötig.*|.*Ancora necessario.*"
- assertNotVisible: "Signals active|Signaux actifs|Señales activas|Signale aktiv|Segnali attivi"
- assertNotVisible: "Stop signals|Arrêter les signaux|Detener señales|Signale stoppen|Ferma segnali"

# And it stays refused across a remount: the gate is a rule, not a first-render
# accident.
- tapOn:
    id: lucid-tab-today
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-today
    timeout: 20000
- tapOn:
    id: lucid-tab-night
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-night
    timeout: 20000
- assertVisible:
    id: lucid-night-start
- assertVisible: ".*Still required.*|.*Encore nécessaire.*|.*Aún necesario.*|.*Noch nötig.*|.*Ancora necessario.*"
- assertVisible: ".*accept audio safety.*|.*accepter la sécurité audio.*|.*aceptar la seguridad de audio.*|.*Audio-Sicherheit bestätigen.*|.*accettare la sicurezza audio.*"
- assertNotVisible: "Stop signals|Arrêter les signaux|Detener señales|Signale stoppen|Ferma segnali"
