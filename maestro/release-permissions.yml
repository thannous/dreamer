# Release permissions gate: exercise deterministic denied/allowed states without OS-dialog races.
appId: ${APP_ID || "com.tanuki75.noctalia"}
name: Release microphone and notification permissions
tags:
  - release
  - permissions
onFlowComplete:
  - setAirplaneMode: disabled
  - setPermissions:
      permissions:
        all: allow
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
    permissions:
      all: allow
      microphone: deny
      notifications: deny
- runFlow: subflows/connect-development-client.yml
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 20000
- runFlow: subflows/dismiss-first-launch-onboarding.yml

# Reach recording regardless of the responsive startup route chosen after onboarding.
- runFlow:
    when:
      visible:
        id: btn.navigateJournal
    commands:
      - tapOn:
          id: btn.navigateJournal
- runFlow:
    when:
      visible:
        id: tab.journal
    commands:
      - tapOn:
          id: tab.journal
- runFlow:
    when:
      visible:
        id: screen.journal
    commands:
      - runFlow:
          when:
            visible:
              id: btn.addDream
          commands:
            - tapOn:
                id: btn.addDream
      - runFlow:
          when:
            visible:
              id: tab.addDream
          commands:
            - tapOn:
                id: tab.addDream
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000

# A denied microphone must offer the explicit text fallback, never block capture.
- extendedWaitUntil:
    visible:
      id: btn.recording.inputMode.voice
    timeout: 10000
- tapOn:
    id: btn.recording.inputMode.voice
- runFlow:
    when:
      notVisible:
        id: sheet.recording.micRationale
    commands:
      - scrollUntilVisible:
          element:
            id: btn.recordToggle
          direction: DOWN
      - tapOn:
          id: btn.recordToggle
- extendedWaitUntil:
    visible:
      id: sheet.recording.micRationale
    timeout: 10000
- tapOn:
    id: btn.recording.micRationale.useText
- extendedWaitUntil:
    visible:
      id: input.dreamTranscript
    timeout: 10000

# The settings surface must reflect denied notifications.
- openLink: ${DEEP_LINK_SCHEME || "noctalia"}://settings
- extendedWaitUntil:
    visible:
      id: screen.settings
    timeout: 20000
- scrollUntilVisible:
    element:
      id: text.settings.notificationsPermissionWarning
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- assertVisible:
    id: text.settings.notificationsPermissionWarning

# Grant both permissions out of band, then resume so AppState refreshes native status.
- setPermissions:
    permissions:
      microphone: allow
      notifications: allow
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible:
      id: text.settings.notificationsPermissionWarning
    timeout: 10000

# Remount recording and verify the granted microphone bypasses the rationale sheet.
- openLink: ${DEEP_LINK_SCHEME || "noctalia"}://recording
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: btn.recording.inputMode.voice
    timeout: 10000
- tapOn:
    id: btn.recording.inputMode.voice
- runFlow:
    when:
      notVisible:
        id: "recording-listening-status|text.recording.voiceStatusDuration"
    commands:
      - scrollUntilVisible:
          element:
            id: btn.recordToggle
          direction: DOWN
      - tapOn:
          id: btn.recordToggle
- assertNotVisible:
    id: sheet.recording.micRationale

# This flow qualifies permission handling. Actual dictation needs the separate
# voice journey with an available speech service and audio fixture.
- runFlow:
    when:
      visible: "Language Pack for Voice Recording|Pack de langue pour la reconnaissance vocale|Paquete de idioma para grabación de voz|Pacchetto lingua per la registrazione vocale|Sprachpaket für die Aufnahme"
    commands:
      - tapOn: "Cancel|Annuler|Cancelar|Annulla|Abbrechen"
- runFlow: subflows/ensure-recording-text.yml
- tapOn:
    id: input.dreamTranscript
- inputText: "E2E text capture remains available after microphone permission changes."
- hideKeyboard
- assertVisible:
    id: input.dreamTranscript
    text: "E2E text capture remains available after microphone permission changes."
- takeScreenshot: permissions-text-fallback

# Revoke notifications once more and prove the settings refresh handles the denial.
- setPermissions:
    permissions:
      notifications: deny
- pressKey: Home
- launchApp:
    permissions:
      all: allow
      microphone: allow
      notifications: deny
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- openLink: ${DEEP_LINK_SCHEME || "noctalia"}://settings
- extendedWaitUntil:
    visible:
      id: screen.settings
    timeout: 20000
- scrollUntilVisible:
    element:
      id: text.settings.notificationsPermissionWarning
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- assertVisible:
    id: text.settings.notificationsPermissionWarning
