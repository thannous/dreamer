# Fail closed before synthetic input: never erase or append to an existing draft.
# The enabled mode control proves hydration completed; the raw count includes
# whitespace. Match the counter's own ID and exact text within this screen:
# Android can expose the progress wrapper and counter as accessible siblings.
appId: ${APP_ID || "com.tanuki75.noctalia"}
---
- extendedWaitUntil:
    visible:
      id: screen.recording
      containsDescendants:
        - id: btn.recording.inputMode.text
          enabled: true
    timeout: 15000
- tapOn:
    id: btn.recording.inputMode.text
- extendedWaitUntil:
    visible:
      id: screen.recording
      containsDescendants:
        - id: btn.recording.inputMode.text
          enabled: true
        - id: component.recording.draftProgress
        - id: component.recording.draftProgress.count
          text: "^0 (caractères|characters|caracteres|Zeichen|caratteri)$"
        - id: input.dreamTranscript
          enabled: true
    timeout: 15000
- tapOn:
    id: input.dreamTranscript
