# The companion is a separate store application: com.tanuki75.noctalia.lucid,
# never com.tanuki75.noctalia. Both dev clients can sit on the same device.
appId: com.tanuki75.noctalia.lucid
env:
  # expo-dev-client dérive son schéma du SLUG, pas du champ `scheme` :
  # getDefaultScheme.js retourne `exp+${slug}`. Le slug Lucid est
  # `noctalia-lucid-trainer` (app.config.ts:98), son scheme applicatif est
  # `noctalia-lucid` (:99) — les deux diffèrent, contrairement à l'app
  # principale où slug et scheme valent tous deux `noctalia`.
  DEV_CLIENT_URL: exp+noctalia-lucid-trainer://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- openLink: ${DEV_CLIENT_URL}
# "Continue" is also the label of the onboarding primary button in English:
# only tap the dev-client dialog while the Lucid shell is not mounted yet.
- runFlow:
    when:
      visible: "Continue"
      notVisible:
        id: lucid-onboarding
    commands:
      - tapOn:
          text: "Continue"
          retryTapIfNoChange: true
          optional: true
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
          retryTapIfNoChange: true
          optional: true
- runFlow:
    when:
      visible: "Minimize"
    commands:
      - tapOn:
          text: "Minimize"
          retryTapIfNoChange: true
          optional: true
# A cleared install has no completed onboarding, so the Lucid shell must gate
# every route to /lucid/onboarding before anything else can be reached.
- extendedWaitUntil:
    visible:
      id: lucid-onboarding
    timeout: 90000
- assertVisible:
    id: lucid-onboarding
