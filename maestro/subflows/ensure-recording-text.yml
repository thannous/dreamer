appId: ${APP_ID || "com.tanuki75.noctalia"}
---
- assertVisible:
    id: screen.recording
- runFlow:
    when:
      visible:
        id: btn.recording.inputMode.text
    commands:
      - tapOn:
          id: btn.recording.inputMode.text
      - extendedWaitUntil:
          visible:
            id: input.dreamTranscript
          timeout: 10000
- assertVisible:
    id: input.dreamTranscript
