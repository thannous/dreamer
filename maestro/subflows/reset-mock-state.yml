appId: com.tanuki75.noctalia
---
- runFlow:
    when:
      visible:
        id: btn.navigateJournal
    commands:
      - tapOn:
          id: btn.navigateJournal
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: screen.recording
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 38%
      - waitForAnimationToEnd
      - tapOn:
          id: tab.journal
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.mockNav.settings
    commands:
      - tapOn:
          id: btn.mockNav.settings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.navigateSettings
    commands:
      - tapOn:
          id: btn.navigateSettings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.header.home.settings
    commands:
      - tapOn:
          id: btn.header.home.settings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: screen.journal
      notVisible:
        id: btn.header.home.settings
    commands:
      - tapOn:
          id: tab.home
      - waitForAnimationToEnd
      - tapOn:
          id: btn.header.home.settings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: settings-account-open-signup
      notVisible:
        id: settings-account-sheet
    commands:
      - tapOn:
          id: settings-account-open-signup
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: settings-account-sheet
    timeout: 10000
- scrollUntilVisible:
    element:
      id: btn.mock.resetState
    direction: DOWN
- tapOn:
    id: btn.mock.resetState
- waitForAnimationToEnd
- runFlow: open-mock-app.yml
