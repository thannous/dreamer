appId: com.tanuki75.noctalia
name: Test Store SDK probe without a purchase
---
- runFlow: journeys/subflows/start-guest.yml
- openLink: noctalia://settings
- extendedWaitUntil:
    visible: "Settings|Paramètres|Configuración|Ajustes"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: screen.subscription.qaLab
    direction: DOWN
    visibilityPercentage: 40
    timeout: 30000
- tapOn:
    id: screen.subscription.qaLab.toggle
- assertVisible:
    id: text.subscription.qa.mode
    text: "RevenueCat Test Store"
- extendedWaitUntil:
    visible:
      id: text.subscription.qa.packages
      text: "2"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: btn.subscription.qa.probe
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
- tapOn:
    id: btn.subscription.qa.probe
- scrollUntilVisible:
    element:
      id: text.subscription.qa.actionLabel
    direction: UP
    visibilityPercentage: 60
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: text.subscription.qa.actionLabel
      text: "SDK probe completed"
    timeout: 60000
- assertVisible:
    id: text.subscription.qa.action
    text: "packages 2.*"
- assertNotVisible: "SDK probe failed"
- takeScreenshot: teststore-sdk-probe-without-purchase
