# Ensure the bundle identifier matches the local Lucid Trainer dev build.
appId: com.tanuki75.noctalia.lucid
---
- runFlow: subflows/open-lucid-app.yml
- runFlow: subflows/complete-lucid-onboarding.yml

# Today is where onboarding lands, and it carries the screen title, not just the
# tab label: a tab that mounts an empty shell would still show its own label.
- assertVisible:
    id: lucid-today
- assertVisible: "Train awareness, protect sleep|Entraînez l’attention, protégez le sommeil|Entrena la atención, protege el sueño|Achtsamkeit trainieren, Schlaf schützen|Allena l’attenzione, proteggi il sonno"

- tapOn:
    id: lucid-tab-programs
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-programs
    timeout: 20000
- assertVisible: "Train with a plan|Un entraînement structuré|Entrena con un plan|Training mit Plan|Allenati con un piano"

- tapOn:
    id: lucid-tab-night
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-night
    timeout: 20000
- assertVisible: "Set a quiet intention|Posez une intention calme|Fija una intención tranquila|Eine ruhige Absicht setzen|Imposta un’intenzione calma"

- tapOn:
    id: lucid-tab-progress
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-progress
    timeout: 20000
- assertVisible: "Patterns, not promises|Des tendances, pas des promesses|Patrones, no promesas|Muster statt Versprechen|Schemi, non promesse"

- tapOn:
    id: lucid-tab-settings
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-settings
    timeout: 20000
- assertVisible: "Your trainer, your choices|Votre entraînement, vos choix|Tu entrenamiento, tus decisiones|Dein Training, deine Wahl|Il tuo training, le tue scelte"

# Back to the first tab: the bar keeps working after a full round trip.
- tapOn:
    id: lucid-tab-today
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-today
    timeout: 20000

# The reality check is a modal on its own route, and it answers to the same rule
# as the morning review: nothing is pre-answered, so nothing is saveable in one
# tap. Reached by deep link because the Today card has no identifier of its own.
- openLink: noctalia-lucid://lucid/reality-check
- extendedWaitUntil:
    visible:
      id: lucid-reality-check
    timeout: 30000
- scrollUntilVisible:
    element:
      id: lucid-reality-save
    direction: DOWN
    timeout: 30000
- assertVisible: ".*Still to answer.*|.*À renseigner.*|.*Falta responder.*|.*Noch offen.*|.*Ancora da indicare.*"
- tapOn:
    id: lucid-reality-save
- waitForAnimationToEnd
- assertNotVisible: "Check saved|Test enregistré|Prueba guardada|Check gespeichert|Test salvato"
- assertVisible:
    id: lucid-reality-check
- pressKey: back
- extendedWaitUntil:
    visible:
      id: lucid-today
    timeout: 20000
