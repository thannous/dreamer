# Release draft gate: an unsaved fragment survives Android process death.
appId: ${APP_ID || "com.tanuki75.noctalia"}
name: Release draft kill relaunch
tags:
  - release
  - draft
  - lifecycle
---
- launchApp:
    stopApp: false
- runFlow: subflows/open-release-recording.yml
- runFlow: subflows/ensure-recording-text.yml

- runFlow: subflows/ti429-ready-empty-editor.yml
- inputText: "Draft kill relaunch sentinel"
- hideKeyboard
- extendedWaitUntil:
    visible: "Draft saved on this device|Brouillon enregistré sur cet appareil|Borrador guardado en este dispositivo|Bozza salvata su questo dispositivo|Entwurf auf diesem Gerät gespeichert|Rascunho salvo neste dispositivo"
    timeout: 15000
- assertVisible:
    id: input.dreamTranscript
    text: "^Draft kill relaunch sentinel$"

- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- runFlow: subflows/open-release-recording.yml
- runFlow: subflows/ensure-recording-text.yml
- extendedWaitUntil:
    visible: "Draft kill relaunch sentinel"
    timeout: 15000
- assertVisible:
    id: input.dreamTranscript
    text: "^Draft kill relaunch sentinel$"
- takeScreenshot: ti429-draft-kill-restored

# Additive cleanup: retain this synthetic story in Journal, never clear a draft.
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 30000
- assertVisible: "Draft kill relaunch sentinel"
