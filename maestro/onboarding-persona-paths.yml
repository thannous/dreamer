appId: com.tanuki75.noctalia
env:
  DEV_CLIENT_URL: exp+noctalia://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 60000
- assertVisible:
    id: component.onboarding.intro
- assertVisible:
    id: component.onboarding.introSignals
- tapOn:
    id: btn.onboarding.intro.next
- extendedWaitUntil:
    visible:
      id: btn.onboarding.path.memory
    timeout: 30000
- assertVisible:
    id: btn.onboarding.path.analyze
- assertVisible:
    id: btn.onboarding.path.memory
- assertVisible:
    id: btn.onboarding.primary

# Default analyze path: a current dream opens fresh capture.
- tapOn:
    id: btn.onboarding.primary
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 30000
- assertNotVisible:
    id: component.recording.rememberedProfileChips
- tapOn:
    id: input.dreamTranscript
- inputText: "Je traverse une gare et je retrouve une cle."
- hideKeyboard
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 30000

# Memory path: an already-lived dream should open remembered capture.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 60000
- tapOn:
    id: btn.onboarding.intro.next
- extendedWaitUntil:
    visible:
      id: btn.onboarding.path.memory
    timeout: 30000
- tapOn:
    id: btn.onboarding.path.memory
- tapOn:
    id: btn.onboarding.primary
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 60000
- assertNotVisible:
    id: component.recording.rememberedProfileChips
- assertVisible:
    id: btn.recording.inputMode.text
- assertVisible:
    id: btn.recording.inputMode.voice
- tapOn:
    id: btn.recording.inputMode.voice
- assertVisible:
    id: text.recording.inputMode.voice
- tapOn:
    id: btn.recording.inputMode.text
- assertVisible:
    id: input.dreamTranscript
- tapOn:
    id: input.dreamTranscript
- inputText: "Un souvenir ancien de maison et de pluie."
- hideKeyboard
- assertVisible:
    id: btn.recording.remembered.metadata.toggle
- tapOn:
    id: btn.recording.remembered.metadata.toggle
- extendedWaitUntil:
    visible:
      id: sheet.recording.remembered.details
    timeout: 30000
- assertVisible:
    id: sheet.recording.remembered.details
- assertVisible:
    id: component.recording.rememberedProfileChips
- tapOn:
    id: btn.recording.remembered.details.done
- waitForAnimationToEnd
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 30000

# Dictionary path: opens the symbol dictionary.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 60000
- tapOn:
    id: btn.onboarding.intro.next
- extendedWaitUntil:
    visible:
      id: btn.onboarding.path.memory
    timeout: 30000
- tapOn:
    id: btn.onboarding.path.dictionary
- tapOn:
    id: btn.onboarding.primary
- extendedWaitUntil:
    visible:
      id: symbol-list
    timeout: 30000
- tapOn:
    id: symbol.item.water
- extendedWaitUntil:
    visible:
      id: screen.symbolDetail
    timeout: 30000

# Skip is terminal for this session and opens capture without implicit prompts.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible:
      id: screen.onboarding
    timeout: 60000
- swipe:
    start: 90%, 10%
    end: 12%, 82%
    duration: 1000
- tapOn:
    id: btn.onboarding.skip
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
      - swipe:
          start: 90%, 10%
          end: 12%, 82%
          duration: 1000
      - tapOn:
          id: btn.onboarding.skip
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 30000
- assertNotVisible:
    id: component.recording.unforgettableDreamPrompt
- assertNotVisible:
    id: component.recording.onboardingTour
- openLink: noctalia://settings
- extendedWaitUntil:
    visible:
      id: settings-section-preferences
    timeout: 30000
- assertNotVisible:
    id: btn.recording.onboarding.restart
