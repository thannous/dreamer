# Release analysis interruption gate: starting analysis then killing the app
# must keep the original transcript and surface a recoverable reflection CTA.
# Independent QA must verify real-analysis eligibility and paid-session
# authorization first; a CTA tap alone never proves that analysis started.
appId: ${APP_ID || "com.tanuki75.noctalia"}
env:
  TI429_RUN_ID: ${Date.now() + "-" + Math.floor(Math.random() * 1000000000)}
name: Release analysis interrupt recovery
tags:
  - release
  - analysis
  - interrupt
---
- launchApp:
    stopApp: false
- runFlow: subflows/open-release-recording.yml
- runFlow: subflows/ensure-recording-text.yml

- runFlow: subflows/ti429-ready-empty-editor.yml
- inputText: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 20000
- assertVisible: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
- tapOn:
    id: btn.dream.primaryCta
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
    commands:
      - runFlow:
          when:
            visible:
              id: btn.navigateJournal
          commands:
            - tapOn:
                id: btn.navigateJournal
      - runFlow:
          when:
            visible:
              id: tab.journal
          commands:
            - tapOn:
                id: tab.journal
      - extendedWaitUntil:
          visible:
            id: screen.journal
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "dream.item.*"
            containsDescendants:
              - text: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
          timeout: 20000
      - tapOn:
          id: "dream.item.*"
          containsDescendants:
            - text: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 20000
- assertVisible: "Analysis interrupt sentinel ${TI429_RUN_ID} silver orchard"
- takeScreenshot: ti429-analysis-interrupt-transcript
- scrollUntilVisible:
    element:
      id: btn.dream.primaryCta
    direction: DOWN
- assertVisible:
    id: btn.dream.primaryCta
