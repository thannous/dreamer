# Verify journal quick filters, advanced sheet, and coherent reset with mock existing user
appId: com.tanuki75.noctalia
---
- runFlow: subflows/open-mock-app.yml
- tapOn:
      id: btn.mockNav.journal
- extendedWaitUntil:
      visible:
          id: screen.journal
      timeout: 30000
- runFlow: subflows/clear-journal-filters.yml
# Switch to existing user profile to load predefined dreams
- runFlow: subflows/select-existing-mock-profile.yml
- tapOn:
      id: tab.journal
- extendedWaitUntil:
      visible:
          id: screen.journal
      timeout: 30000
- runFlow: subflows/clear-journal-filters.yml
- assertVisible:
      id: btn.filterAll
- assertVisible:
      id: btn.filterFavorites
- assertVisible:
      id: btn.filterToDeepen
- assertVisible:
      id: btn.filterMore
# Apply deepen-only filter (analyzed, not yet explored)
- tapOn:
      id: btn.filterToDeepen
- extendedWaitUntil:
      visible: "The Infinite Library"
      timeout: 10000
- assertVisible: "The Infinite Library"
- assertNotVisible: "Ocean of Stars"
# Reset from Tous must restore the full list
- tapOn:
      id: btn.filterAll
- extendedWaitUntil:
      visible: "Ocean of Stars"
      timeout: 10000
- assertVisible: "Ocean of Stars"
- assertVisible: "The Infinite Library"
# Favorites remain available as a mutually exclusive quick filter
- tapOn:
      id: btn.filterFavorites
- extendedWaitUntil:
      visible: "Ocean of Stars"
      timeout: 10000
- assertVisible: "Ocean of Stars"
- tapOn:
      id: btn.filterAll
- extendedWaitUntil:
      visible: "The Infinite Library"
      timeout: 10000
# Advanced sheet still exposes status filters
- tapOn:
      id: btn.filterMore
- extendedWaitUntil:
      visible:
          id: modal.advancedFilters
      timeout: 10000
- tapOn:
      id: btn.filterStatus.explored
- tapOn: "Done"
- extendedWaitUntil:
      visible: "Ocean of Stars"
      timeout: 10000
- assertVisible: "Ocean of Stars"
- assertNotVisible: "The Infinite Library"
