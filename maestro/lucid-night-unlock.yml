# The other half of Night safety: lucid-night-safety.yml proves the gate refuses
# and names its condition. This one proves the gate OPENS once the conditions
# are met on Night itself — without it, a button wired to `false` would pass.
appId: com.tanuki75.noctalia.lucid
---
- runFlow: subflows/open-lucid-app.yml
- runFlow: subflows/complete-lucid-onboarding.yml

- tapOn:
    id: lucid-tab-night
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: lucid-night
    timeout: 20000

# After onboarding, audio safety is still off. Accept it here, at the moment of
# use, then confirm the playback route.
- assertVisible:
    id: lucid-night-start
- assertVisible: ".*Still required.*|.*Encore nécessaire.*|.*Aún necesario.*|.*Noch nötig.*|.*Ancora necessario.*"
- assertVisible: ".*accept audio safety.*|.*accepter la sécurité audio.*|.*aceptar la seguridad de audio.*|.*Audio-Sicherheit bestätigen.*|.*accettare la sicurezza audio.*"

- scrollUntilVisible:
    element:
      id: lucid-night-audio-safety
    direction: DOWN
- tapOn:
    id: lucid-night-audio-safety
- waitForAnimationToEnd
- assertNotVisible: ".*accept audio safety.*|.*accepter la sécurité audio.*|.*aceptar la seguridad de audio.*|.*Audio-Sicherheit bestätigen.*|.*accettare la sicurezza audio.*"
- assertVisible: ".*phone speaker.*|.*haut-parleur du téléphone.*|.*altavoz del teléfono.*|.*Telefonlautsprecher.*|.*altoparlante del telefono.*"

- scrollUntilVisible:
    element:
      id: lucid-night-speaker
    direction: DOWN
- tapOn:
    id: lucid-night-speaker
- waitForAnimationToEnd

# The gate opens: no condition left to name.
- assertNotVisible: ".*Still required.*|.*Encore nécessaire.*|.*Aún necesario.*|.*Noch nötig.*|.*Ancora necessario.*"
- assertVisible:
    id: lucid-night-start
