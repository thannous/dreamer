# Release guest-unlimited gate (TI-418): save at least three guest dreams
# in one install/state. Before each save, no account or paywall may block.
# After the third save, all three entries must exist in Journal.
# No analysis, image, purchase or data reset.
appId: ${APP_ID || "com.tanuki75.noctalia"}
name: Release guest unlimited local saves
tags:
  - release
  - guest
  - journal
---
- launchApp:
    stopApp: false

# Require an existing guest session. Never sign out or reset an authenticated
# user's app. QuotaStatusCard exposes the localised guest tier in Settings.
- openLink: ${DEEP_LINK_SCHEME || "noctalia"}://settings
- extendedWaitUntil:
    visible: "Settings|Paramètres|Configuración|Ajustes|Impostazioni|Einstellungen"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Guest|Invité|Gast|Invitado|Ospite|Visitante"
    direction: UP
    timeout: 20000
    visibilityPercentage: 40
- assertVisible: "Guest|Invité|Gast|Invitado|Ospite|Visitante"
- assertNotVisible:
    id: btn.auth.signOut
- assertNotVisible:
    id: screen.paywall

- openLink: ${DEEP_LINK_SCHEME || "noctalia"}://recording
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- runFlow: subflows/ensure-recording-text.yml

- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: btn.auth.signIn
- assertNotVisible:
    id: btn.quotaLimit.ctaGuest
- runFlow: subflows/ti429-ready-empty-editor.yml
- inputText: "Guest unlimited sentinel one"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 20000
- assertVisible: "Guest unlimited sentinel one"
- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: sheet.quotaLimit

- tapOn:
    id: btn.navigateJournal
- extendedWaitUntil:
    visible:
      id: screen.journal
    timeout: 20000
- assertVisible: "Guest unlimited sentinel one"
- runFlow: subflows/open-release-recording.yml
- runFlow: subflows/ensure-recording-text.yml

- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: btn.auth.signIn
- assertNotVisible:
    id: btn.quotaLimit.ctaGuest
- runFlow: subflows/ti429-ready-empty-editor.yml
- inputText: "Guest unlimited sentinel two"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 20000
- assertVisible: "Guest unlimited sentinel two"
- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: sheet.quotaLimit

- tapOn:
    id: btn.navigateJournal
- extendedWaitUntil:
    visible:
      id: screen.journal
    timeout: 20000
- assertVisible: "Guest unlimited sentinel two"
- runFlow: subflows/open-release-recording.yml
- runFlow: subflows/ensure-recording-text.yml

- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: btn.auth.signIn
- assertNotVisible:
    id: btn.quotaLimit.ctaGuest
- runFlow: subflows/ti429-ready-empty-editor.yml
- inputText: "Guest unlimited sentinel three"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn.saveDream
    direction: DOWN
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: text.dreamDetail.actionTitle
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 20000
- assertVisible: "Guest unlimited sentinel three"
- assertNotVisible:
    id: screen.paywall
- assertNotVisible:
    id: sheet.quotaLimit

- tapOn:
    id: btn.navigateJournal
- extendedWaitUntil:
    visible:
      id: screen.journal
    timeout: 20000
- assertVisible: "Guest unlimited sentinel one"
- assertVisible: "Guest unlimited sentinel two"
- assertVisible: "Guest unlimited sentinel three"
- takeScreenshot: ti429-guest-unlimited
