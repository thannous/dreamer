# Validate quota + stats numbers for the mock existing user profile
appId: com.tanuki75.noctalia
---
- runFlow: subflows/open-mock-app.yml
- runFlow: subflows/select-existing-mock-profile.yml
- runFlow:
    when:
      visible:
        id: btn.navigateJournal
    commands:
      - tapOn:
          id: btn.navigateJournal
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: screen.recording
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 38%
      - waitForAnimationToEnd
      - tapOn:
          id: tab.journal
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.mockNav.settings
    commands:
      - tapOn:
          id: btn.mockNav.settings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.navigateSettings
    commands:
      - tapOn:
          id: btn.navigateSettings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: btn.header.home.settings
    commands:
      - tapOn:
          id: btn.header.home.settings
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: screen.journal
      notVisible:
        id: btn.header.home.settings
    commands:
      - tapOn:
          id: tab.home
      - waitForAnimationToEnd
      - tapOn:
          id: btn.header.home.settings
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: quota.analysisValue
    direction: DOWN
    speed: 30
    visibilityPercentage: 60
    centerElement: true
    timeout: 30000
- assertVisible:
    id: quota.analysisValue
- assertVisible: "5 / 3"
- assertNotVisible:
    id: quota.explorationValue
- assertNotVisible:
    id: quota.imageValue
- tapOn:
    id: tab.stats
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: trends.section.week
    timeout: 20000
- assertVisible:
    id: trends.section.week
- scrollUntilVisible:
    element:
      id: trends.section.patterns
    direction: DOWN
- assertVisible:
    id: trends.section.patterns
- scrollUntilVisible:
    element:
      id: trends.section.evolution
    direction: DOWN
- assertVisible:
    id: trends.section.evolution
