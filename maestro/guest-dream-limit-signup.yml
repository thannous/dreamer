appId: com.tanuki75.noctalia
---
# Guest journal is unlimited locally; signup migrates every saved dream.
- runFlow: subflows/open-mock-app.yml
- runFlow: subflows/reset-mock-state.yml

# Guest dream 1
- runFlow: subflows/ensure-recording-text.yml
- tapOn:
    id: input.dreamTranscript
- inputText: "Guest Limit Dream 1"
- tapOn:
    id: btn.saveDream
- waitForAnimationToEnd
- tapOn:
    id: btn.firstDream.dismiss

# Guest dream 2
- tapOn:
    id: btn.navigateJournal
- tapOn:
    id: btn.addDream
- runFlow: subflows/ensure-recording-text.yml
- tapOn:
    id: input.dreamTranscript
- inputText: "Guest Limit Dream 2"
- tapOn:
    id: btn.saveDream
- waitForAnimationToEnd
- assertVisible:
    id: text.analyzePromptTitle
- tapOn:
    id: btn.analyzePrompt.journal
- waitForAnimationToEnd

# Guest dream 3 - still saved as guest
- tapOn:
    id: btn.addDream
- runFlow: subflows/ensure-recording-text.yml
- tapOn:
    id: input.dreamTranscript
- inputText: "Guest Limit Dream 3"
- tapOn:
    id: btn.saveDream
- waitForAnimationToEnd
- assertVisible:
    id: text.analyzePromptTitle
- tapOn:
    id: btn.analyzePrompt.journal
- waitForAnimationToEnd
- assertVisible:
    id: screen.journal
- assertVisible: "Guest Limit Dream 1"
- assertVisible: "Guest Limit Dream 2"
- assertVisible: "Guest Limit Dream 3"

# Create account via settings; all local dreams must remain after signup
- tapOn:
    id: btn.mockNav.settings
- scrollUntilVisible:
    element:
      id: input.auth.password
    direction: DOWN
- tapOn:
    id: input.auth.password
- inputText: "guestpass"
- tapOn:
    id: input.auth.email
- inputText: "guest.limit+signup@dreamer.test"
- pressKey: back
- scrollUntilVisible:
    element:
      id: btn.auth.signUp
    direction: DOWN
- tapOn:
    id: btn.auth.signUp
- tapOn: "OK|D'accord|Aceptar"
- tapOn:
    id: btn.navigateJournal
- waitForAnimationToEnd
- assertVisible:
    id: screen.journal
- assertVisible: "Guest Limit Dream 1"
- assertVisible: "Guest Limit Dream 2"
- assertVisible: "Guest Limit Dream 3"
