appId: com.tanuki75.noctalia
name: Free user saves and reopens their own story
tags: [journeys, free, mock]
env:
  PROFILE: existing
---
- runFlow: subflows/start-guest.yml
- runFlow: subflows/select-profile.yml
- tapOn:
    id: input.dreamTranscript
- inputText: "E2E free traveler in a sapphire garden."
- hideKeyboard
- tapOn:
    id: btn.saveDream
- extendedWaitUntil:
    visible:
      id: component.transcriptCard
    timeout: 30000
- assertVisible: "E2E free traveler in a sapphire garden."
- tapOn:
    id: btn.navigateJournal
- runFlow: ../subflows/ensure-journal-search-visible.yml
- tapOn:
    id: input.searchDreams
- inputText: "free traveler"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "dream.item.*"
    timeout: 15000
- tapOn:
    id: "dream.item.*"
- scrollUntilVisible:
    element:
      id: component.transcriptCard
    direction: DOWN
- assertVisible: "E2E free traveler in a sapphire garden."
- takeScreenshot: free-story-reopened
