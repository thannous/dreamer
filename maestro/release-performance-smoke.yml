# Performance acceptance smoke for an installed Release APK.
# The flow deliberately preserves app data and removes the temporary transcript.
appId: com.tanuki75.noctalia
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- runFlow: subflows/ensure-recording-text.yml

# Prove that the first screen accepts text without persisting a dream.
- tapOn:
    id: input.dreamTranscript
- inputText: PerfSmoke
- eraseText: 9
- pressKey: back
- assertVisible:
    id: input.dreamTranscript

# Exercise the microphone entry point without changing the permission decision.
- tapOn:
    id: btn.recordToggle
- extendedWaitUntil:
    visible: "[0-9]+:[0-9]{2}|Language Pack for Voice Recording|Pack de langue pour la reconnaissance vocale|Paquete de idioma para grabación de voz|Pacchetto lingua per la registrazione vocale|Sprachpaket für die Aufnahme"
    timeout: 20000
- evalScript: ${output.microphoneOutcome = 0}
- runFlow:
    when:
      visible: "[0-9]+:[0-9]{2}"
    commands:
      - tapOn:
          id: btn.recordToggle
      - evalScript: ${output.microphoneOutcome = 1}
- runFlow:
    when:
      visible: "Language Pack for Voice Recording|Pack de langue pour la reconnaissance vocale|Paquete de idioma para grabación de voz|Pacchetto lingua per la registrazione vocale|Sprachpaket für die Aufnahme"
    commands:
      - tapOn: "Cancel|Annuler|Cancelar|Annulla|Abbrechen"
      - evalScript: ${output.microphoneOutcome = 2}
- assertTrue: ${output.microphoneOutcome > 0}
- runFlow: subflows/ensure-recording-text.yml

# Prove that the main navigation remains responsive after the startup work.
- tapOn:
    id: tab.journal
- extendedWaitUntil:
    visible:
      id: screen.journal
    timeout: 20000
- tapOn:
    id: tab.addDream
- extendedWaitUntil:
    visible:
      id: screen.recording
    timeout: 20000
- assertVisible:
    id: input.dreamTranscript
