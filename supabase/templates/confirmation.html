<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Confirm your email for Noctalia</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    @media (max-width: 480px) {
      .email-gutter { padding: 16px 12px !important; }
      .email-inset { padding-left: 22px !important; padding-right: 22px !important; }
      .email-title { font-size: 32px !important; line-height: 1.15 !important; }
    }
    @media (prefers-color-scheme: dark) {
      .email-ground { background-color: #03040D !important; }
      .email-paper { background-color: #14131A !important; border-color: #514637 !important; }
      .email-ink { color: #FFF9EF !important; }
      .email-muted { color: #B7AEC9 !important; }
      .email-accent { color: #EAD4B4 !important; }
      .email-rule { border-color: #514637 !important; }
      .email-action { background-color: #EAD4B4 !important; color: #382D35 !important; }
    }
  </style>
</head>
<body class="email-ground" style="margin: 0; padding: 0; background-color: #F0E4D4; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">
  <div aria-hidden="true" style="display: none; max-height: 0; max-width: 0; overflow: hidden; mso-hide: all;">
    One step to open your Noctalia dream journal.
  </div>
  <table class="email-ground" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F0E4D4" style="background-color: #F0E4D4;">
    <tr>
      <td class="email-gutter" align="center" style="padding: 36px 20px;">
        <!--[if mso]><table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
        <table class="email-paper" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F5EADB" style="max-width: 560px; background-color: #F5EADB; border: 1px solid #DDCDB2; border-radius: 18px;">
          <tr>
            <td class="email-inset" style="padding: 21px 32px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="42" valign="middle">
                    <img src="https://noctalia.app/logo192.png" width="42" alt="" style="display: block; width: 42px; height: auto; border: 0; border-radius: 10px;">
                  </td>
                  <td valign="middle" style="padding-left: 13px;">
                    <p class="email-ink" style="margin: 0; color: #382D35; font: 27px/1.05 Georgia, 'Times New Roman', serif;">Noctalia</p>
                    <p class="email-accent" style="margin: 4px 0 0; color: #7C4C2B; font: bold 11px/1.35 Arial, sans-serif; letter-spacing: 2px;">DREAM JOURNAL</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <img src="https://noctalia.app/img/hero/noctalia-observatory-bg.webp" width="558" alt="" style="display: block; width: 100%; max-width: 558px; height: auto; border: 0;">
            </td>
          </tr>
          <tr>
            <td class="email-inset" style="padding: 27px 32px 30px;">
              <h1 class="email-title email-ink" style="margin: 0 0 12px; color: #382D35; font: 38px/1.15 Georgia, 'Times New Roman', serif;">Confirm your email</h1>
              <p class="email-muted" style="margin: 0 0 22px; color: #64514F; font: 16px/1.6 Arial, sans-serif;">Your dream journal is waiting. Confirm your address to start recording your dreams and exploring their meaning.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="email-action" bgcolor="#7C4C2B" style="background-color: #7C4C2B; border-radius: 8px; mso-padding-alt: 14px 22px;">
                    <a class="email-action" href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 22px; mso-padding-alt: 0; border-radius: 8px; background-color: #7C4C2B; color: #FFF9EF; font: bold 16px/22px Arial, sans-serif; text-decoration: none;">Confirm my email</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="email-inset email-rule" style="padding: 16px 32px 19px; border-top: 1px solid #DDCDB2;">
              <p class="email-muted" style="margin: 0; color: #64514F; font: 14px/1.5 Arial, sans-serif;">If you didn&rsquo;t sign up for Noctalia, you can ignore this email.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
