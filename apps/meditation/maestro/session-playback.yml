# Home → a free session → playback → the practice is logged.
#
# `sleep-descent` is one of the four sessions bundled with the app, so this
# flow needs no network and no media bucket.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.search'
- assertVisible:
    id: 'screen.search'

# The first row of the catalogue is the first free session.
- scrollUntilVisible:
    element:
      id: 'option.session.sleep-descent'
    direction: DOWN
# Maestro considers the row visible even while the floating tab bar covers its
# centre. Lift it into the unobstructed viewport before tapping it.
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 400
- tapOn:
    id: 'option.session.sleep-descent'
- assertVisible:
    id: 'screen.session'

- tapOn:
    id: 'btn.session.play'
- assertVisible:
    id: 'screen.player'
- assertVisible:
    id: 'btn.player.toggle'

# Essential controls stay visible throughout playback.
- assertVisible:
    id: 'text.player.position'
- assertNotVisible:
    id: 'mini.player'
- tapOn:
    id: 'btn.player.close'
- assertVisible:
    id: 'screen.session'
- assertVisible:
    id: 'mini.state'
    text: 'Lecture en cours'
- tapOn:
    id: 'btn.mini.toggle'
- assertVisible:
    id: 'mini.state'
    text: 'En pause'
- tapOn:
    id: 'btn.mini.toggle'
- assertVisible:
    id: 'mini.state'
    text: 'Lecture en cours'
- tapOn:
    id: 'btn.mini.open'
- assertVisible:
    id: 'screen.player'
- assertNotVisible:
    id: 'mini.player'
- tapOn:
    id: 'btn.player.close'
- tapOn:
    id: 'btn.session.back'
- tapOn:
    id: 'tab.home'
- assertVisible:
    id: 'screen.home'
- assertVisible:
    id: 'mini.player'
- tapOn:
    id: 'btn.mini.close'
- assertNotVisible:
    id: 'mini.player'
