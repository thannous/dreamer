# Home → a free session → playback → the practice is logged.
#
# `sleep-descent` is one of the four sessions bundled with the app, so this
# flow needs no network and no media bucket.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.search'
- assertVisible:
    id: 'screen.search'

# The first row of the catalogue is the first free session.
- scrollUntilVisible:
    element:
      id: 'option.session.sleep-descent'
    direction: DOWN
# Maestro considers the row visible even while the floating tab bar covers its
# centre. Lift it into the unobstructed viewport before tapping it.
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 400
- tapOn:
    id: 'option.session.sleep-descent'
- assertVisible:
    id: 'screen.session'

- tapOn:
    id: 'btn.session.play'
- assertVisible:
    id: 'screen.player'
- assertVisible:
    id: 'btn.player.toggle'

# Playback starts on its own; the chrome then withdraws (progressive silence).
- assertVisible:
    id: 'text.player.position'
- waitForAnimationToEnd:
    timeout: 6000

# One touch anywhere brings the controls back — including over the artwork,
# which is most of the screen and belongs to no control. Then the transport
# answers, which is what proves the whole chrome returned and not just a part.
- tapOn:
    id: 'btn.player.reveal'
- tapOn:
    id: 'btn.player.forward'
- tapOn:
    id: 'btn.player.toggle'

- tapOn:
    id: 'btn.player.close'
- assertVisible:
    id: 'screen.session'

# A started session shows up as resumable on the home screen.
- tapOn:
    id: 'btn.session.back'
- tapOn:
    id: 'tab.home'
- assertVisible:
    id: 'screen.home'
