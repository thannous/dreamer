# A premium session sends a free listener to the paywall, and the purchase
# opens the gate. Runs against the mock store — see config.yaml.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.search'
- assertVisible:
    id: 'screen.search'

# "Dream preparation" is entirely premium — the last category tile.
- scrollUntilVisible:
    element:
      id: 'option.category.dream-prep'
    direction: DOWN
- tapOn:
    id: 'option.category.dream-prep'
- scrollUntilVisible:
    element:
      id: 'option.session.dream-threshold'
    direction: DOWN
- tapOn:
    id: 'option.session.dream-threshold'
- assertVisible:
    id: 'screen.session'

- tapOn:
    id: 'btn.session.play'
- assertVisible:
    id: 'screen.paywall'

# Restore and the legal links are mandatory on a paywall, on either store.
- assertVisible:
    id: 'btn.paywall.restore'

- tapOn:
    id: 'btn.paywall.buy'
- assertVisible:
    id: 'screen.session'

# The same button now passes the entitlement gate. Premium media is remote in
# v1, so the clean simulator reaches the explicit offline state until a media
# bucket is configured; that is still proof that the paywall no longer blocks.
- tapOn:
    id: 'btn.session.play'
- assertVisible:
    id: 'screen.player.unavailable'
- assertNotVisible:
    id: 'screen.paywall'
