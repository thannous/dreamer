# A premium session sends a free listener to the paywall. The mock store is
# available, but this flow never purchases: it only checks that the offer and
# both legal links are visible before the listener leaves.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.search'
- assertVisible:
    id: 'screen.search'

# "Dream preparation" is entirely premium — the last category tile.
- scrollUntilVisible:
    element:
      id: 'option.category.dream-prep'
    direction: DOWN
- tapOn:
    id: 'option.category.dream-prep'
- scrollUntilVisible:
    element:
      id: 'option.session.dream-threshold'
    direction: DOWN
- tapOn:
    id: 'option.session.dream-threshold'
- assertVisible:
    id: 'screen.session'

- tapOn:
    id: 'btn.session.play'
- assertVisible:
    id: 'screen.paywall'

# Trial, price, period and renewal stay visible on the Plus-session gate.
# Monthly-quota is covered by unit tests: exhausting three free plays here
# would make the flow brittle without adding a second commercial surface.
- assertVisible:
    id: 'btn.paywall.close'
- assertVisible:
    id: 'btn.paywall.restore'
- assertVisible:
    id: 'paywall.plan.trial'
- assertVisible:
    id: 'paywall.plan.price'
- assertVisible:
    id: 'paywall.plan.period'
- assertVisible:
    id: 'paywall.plan.renewal'
- assertVisible:
    id: 'paywall.legal.terms'
- assertVisible:
    id: 'paywall.legal.privacy'

# Leave without buying. The session remains gated; the listener is back on
# the detail screen rather than inside a purchase or a browser.
- tapOn:
    id: 'btn.paywall.close'
- assertVisible:
    id: 'screen.session'
- assertNotVisible:
    id: 'screen.paywall'
