# Universe, language, and the reduce-motion fact that must stay a system setting.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.profile'
- assertVisible:
    id: 'screen.profile'

- scrollUntilVisible:
    element:
      id: 'btn.profile.settings'
    direction: DOWN
- tapOn:
    id: 'btn.profile.settings'
- assertVisible:
    id: 'screen.settings'

# Reduce animations is not a toggle: it names the OS setting and does nothing.
- scrollUntilVisible:
    element:
      id: 'settings.motion'
    direction: DOWN
- assertVisible:
    id: 'settings.motion'
- assertVisible:
    id: 'screen.settings'
- assertNotVisible:
    id: 'screen.settings.language'

# Appearance follows the universe. Its settings row returns to the selector
# on Home; re-entering settings must preserve the same local profile.
- tapOn:
    id: 'btn.settings.world'
- assertVisible:
    id: 'screen.home'
- tapOn:
    id: 'tab.profile'
- scrollUntilVisible:
    element:
      id: 'btn.profile.settings'
    direction: DOWN
- tapOn:
    id: 'btn.profile.settings'
- assertVisible:
    id: 'screen.settings'

- tapOn:
    id: 'btn.settings.language'
- assertVisible:
    id: 'screen.settings.language'

# Switching to German must repaint immediately, including the catalogue.
- tapOn:
    id: 'lang.de'
- assertVisible: 'Sprache'
- tapOn:
    id: 'lang.fr'
- assertVisible: 'Langue'
