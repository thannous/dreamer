# Theme, language, and the reduce-motion fact that must stay a system setting.
appId: com.noctalia.meditation
---
- runFlow: onboarding.yml

- tapOn:
    id: 'tab.profile'
- assertVisible:
    id: 'screen.profile'

- scrollUntilVisible:
    element:
      id: 'btn.profile.settings'
    direction: DOWN
- tapOn:
    id: 'btn.profile.settings'
- assertVisible:
    id: 'screen.settings'

# Reduce animations is not a toggle: it names the OS setting and does nothing.
- scrollUntilVisible:
    element:
      id: 'settings.motion'
    direction: DOWN
- assertVisible:
    id: 'settings.motion'
- assertVisible:
    id: 'screen.settings'
- assertNotVisible:
    id: 'screen.settings.language'

# The theme row cycles auto → light → dark. Three taps return to the start,
# which is the assertion: the cycle closes rather than dead-ending.
- tapOn:
    id: 'btn.settings.theme'
- tapOn:
    id: 'btn.settings.theme'
- tapOn:
    id: 'btn.settings.theme'
- assertVisible:
    id: 'screen.settings'

- tapOn:
    id: 'btn.settings.language'
- assertVisible:
    id: 'screen.settings.language'

# Switching to German must repaint immediately, including the catalogue.
- tapOn:
    id: 'lang.de'
- assertVisible: 'Sprache'
- tapOn:
    id: 'lang.fr'
- assertVisible: 'Langue'
