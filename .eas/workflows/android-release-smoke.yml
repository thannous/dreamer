# Dispatch only (common delivery rule, External CI: none): no tag, push or pull
# request starts it. Run on demand with
# `eas workflow:run .eas/workflows/android-release-smoke.yml -F release_tag=vX.Y.Z`.
# scripts/check-android-release-ref.js fails when release_tag is missing or does
# not match app.json. An EAS build needs the owner's explicit go.
name: Android Release Smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: 'Release tag vX.Y.Z; must equal v + expo.version of app.json'

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  validate_android_release_ref:
    name: Validate Android release identity
    env:
      RELEASE_REF_NAME: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: eas/checkout
      - name: Match tag and app versions
        run: node ./scripts/check-android-release-ref.js

  build_android_release_smoke:
    name: Build Android release-smoke APK
    needs: [validate_android_release_ref]
    type: build
    params:
      platform: android
      profile: release-smoke

  validate_android_release_build:
    name: Validate built Android versionCode
    needs: [build_android_release_smoke]
    env:
      # This job exists to check the built code: an empty build output fails
      # instead of passing as a valid identity (scripts/check-android-release-ref.js).
      REQUIRE_BUILT_ANDROID_VERSION_CODE: '1'
      # appVersionSource is remote: EAS assigns the versionCode, so the expected
      # code comes from the metadata of this exact build, never from the local
      # app.json mirror (doc_web_interne/docs/MOBILE_VERSIONING.md).
      EXPECTED_ANDROID_VERSION_CODE: ${{ needs.build_android_release_smoke.outputs.app_build_version }}
      BUILT_ANDROID_VERSION_CODE: ${{ needs.build_android_release_smoke.outputs.app_build_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: eas/checkout
      - name: Match EAS build and app versionCode
        run: node ./scripts/check-android-release-ref.js

  maestro_android_release_smoke:
    name: Run Android release smoke flows
    needs: [build_android_release_smoke, validate_android_release_build]
    type: maestro
    params:
      build_id: ${{ needs.build_android_release_smoke.outputs.build_id }}
      flow_path:
        - maestro/release-smoke.yml
        - maestro/release-lifecycle.yml
        - maestro/release-permissions.yml
        - maestro/release-offline-local.yml
      android_system_image_package: system-images;android-35;google_apis;x86_64
      device_identifier:
        android: pixel_6
      record_screen: true
      retries: 0
