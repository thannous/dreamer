# Dispatch only (common delivery rule, External CI: none). Run on demand with
# `eas workflow:run .eas/workflows/e2e-test-ios.yml`; an EAS build needs the owner's explicit go.
name: e2e-test-ios

on:
  workflow_dispatch: {}

jobs:
  build_ios_for_e2e:
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_test:
    needs: [build_ios_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_for_e2e.outputs.build_id }}
      flow_path:
        - maestro/smoke.yml
