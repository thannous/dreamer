# Dispatch only: no tag, push or pull request starts it. Run on demand with
# `eas workflow:run .eas/workflows/e2e-test-android.yml`; an EAS build needs the owner's explicit go.
name: e2e-test-android

on:
  workflow_dispatch: {}

jobs:
  build_android_for_e2e:
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path:
        - maestro/smoke.yml
