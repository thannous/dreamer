    <text x="72" y="620" fill="#e9d5ff" font-size="15" opacity="0.74">Décomptes descriptifs, pas un classement, une part de marché ni une preuve clinique · Version du 9 août 2026</text>
    <text x="72" y="649" fill="#fda481" font-size="17" font-weight="600">noctalia.app/fr/applications-journal-de-reves</text>
