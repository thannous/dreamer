<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Applications de journal de rêves en 2026 : aperçu des fonctions</title>
  <desc id="description">Graphique basé sur une revue documentaire sourcée de 11 applications. Dix présentent un signal d’interprétation par IA, sept la capture vocale, quatre les images générées et trois une structure pour le rêve lucide.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0514"/><stop offset="0.58" stop-color="#160a2b"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fda481"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="58%"><stop offset="0" stop-color="#fda481" stop-opacity="0.2"/><stop offset="1" stop-color="#fda481" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#background)"/><rect width="1200" height="675" rx="32" fill="url(#glow)"/>
  <circle cx="1090" cy="90" r="3" fill="#fff7ed" opacity="0.8"/><circle cx="1048" cy="130" r="2" fill="#e9d5ff" opacity="0.7"/><circle cx="1125" cy="165" r="2.5" fill="#fda481" opacity="0.75"/>
  <g font-family="Outfit, Inter, system-ui, sans-serif">
