    <text x="72" y="128" fill="#fff7ed" font-size="46" font-weight="650">Applications de journal de rêves en 2026</text>
    <text x="72" y="168" fill="#e9d5ff" font-size="22" opacity="0.86">Signaux issus d’une revue sourcée de 11 applications</text>
    <g fill="#e9d5ff" font-size="16" opacity="0.64"><text x="398" y="213">0</text><text x="952" y="213">11 apps</text></g>
    <g stroke="#fff7ed" stroke-opacity="0.12" stroke-width="1"><line x1="400" y1="222" x2="400" y2="552"/><line x1="700" y1="222" x2="700" y2="552"/><line x1="1000" y1="222" x2="1000" y2="552"/></g>
    <g font-size="22" font-weight="520" fill="#fff7ed"><text x="72" y="265">Interprétation par IA</text><text x="72" y="355">Capture vocale</text><text x="72" y="445">Images générées</text><text x="72" y="535">Structure de rêve lucide</text></g>
    <g><rect x="400" y="238" width="600" height="36" rx="18" fill="#fff7ed" opacity="0.1"/><rect x="400" y="238" width="545" height="36" rx="18" fill="url(#bar)"/><rect x="400" y="328" width="600" height="36" rx="18" fill="#fff7ed" opacity="0.1"/><rect x="400" y="328" width="382" height="36" rx="18" fill="url(#bar)"/><rect x="400" y="418" width="600" height="36" rx="18" fill="#fff7ed" opacity="0.1"/><rect x="400" y="418" width="218" height="36" rx="18" fill="url(#bar)"/><rect x="400" y="508" width="600" height="36" rx="18" fill="#fff7ed" opacity="0.1"/><rect x="400" y="508" width="164" height="36" rx="18" fill="url(#bar)"/></g>
