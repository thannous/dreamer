version: 2.1

parameters:
  pipeline_kind:
    type: enum
    enum:
      - affected
      - full
    default: affected
  diff_base:
    type: string
    default: ""
  run_noctalia:
    type: boolean
    default: false
  run_meditation:
    type: boolean
    default: false
  run_site:
    type: boolean
    default: false
  run_edge_functions:
    type: boolean
    default: false
  run_edge_contracts:
    type: boolean
    default: false
  run_changed_tests:
    type: boolean
    default: false
  run_full_tests:
    type: boolean
    default: false
  require_timing_baseline:
    type: boolean
    default: false
  publish_timing_baseline:
    type: boolean
    default: false
  save_site_npm_cache:
    type: boolean
    default: false
  save_edge_contracts_npm_cache:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:24.19.0
    resource_class: medium
    environment:
      NPM_CONFIG_CACHE: /home/circleci/.npm

  base:
    docker:
      - image: cimg/base:stable
    resource_class: small

commands:
  install-root-dependencies:
    parameters:
      save_cache:
        type: boolean
        default: true
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-node24-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install root dependencies
          command: npm ci
      - when:
          condition: << parameters.save_cache >>
          steps:
            - save_cache:
                key: npm-node24-v1-{{ checksum "package-lock.json" }}
                paths:
                  - /home/circleci/.npm

  install-meditation-dependencies:
    steps:
      - checkout
      - restore_cache:
          keys:
            - meditation-npm-node24-v1-{{ checksum "apps/meditation/package-lock.json" }}
      - run:
          name: Install Meditation dependencies
          working_directory: apps/meditation
          command: npm ci
      - save_cache:
          key: meditation-npm-node24-v1-{{ checksum "apps/meditation/package-lock.json" }}
          paths:
            - /home/circleci/.npm

  install-testerarmy:
    steps:
      - run:
          name: Install isolated locked TesterArmy e2e 0.18.0 dependencies
          command: npm run test:testerarmy:setup
      - run:
          name: Install isolated Chromium and Linux browser dependencies
          command: npm run browsers:install --prefix tools/e2e -- --with-deps
      # Tooling checks do not depend on the shard; parallel nodes run them once.
      - run:
          name: Typecheck TesterArmy journeys
          command: |
            if [[ "${CIRCLE_NODE_INDEX:-0}" == 0 ]]; then npm run test:testerarmy:typecheck; fi
      - run:
          name: Verify fail-closed qualification guards without devices
          command: |
            if [[ "${CIRCLE_NODE_INDEX:-0}" == 0 ]]; then npm run test:testerarmy:guards; fi

jobs:
  noctalia-e2e-backend:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Use the repository Node version
          command: |
            cd /tmp
            curl -fsSLO https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
            curl -fsSLO https://nodejs.org/dist/v24.19.0/SHASUMS256.txt
            sha256sum --check --ignore-missing SHASUMS256.txt
            tar -xJf node-v24.19.0-linux-x64.tar.xz
            echo 'export PATH=/tmp/node-v24.19.0-linux-x64/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Install locked dependencies and Chromium
          command: |
            npm ci
            npx playwright install --with-deps chromium
      - run:
          name: Verify real local Auth, durable journal, account isolation and Free/Plus rights
          command: npm run test:e2e:backend
      - store_test_results:
          path: test-results/e2e-backend-junit
      - store_artifacts:
          path: test-results/e2e-backend-report
          destination: e2e-backend-report
      - store_artifacts:
          path: test-results/e2e-backend
          destination: e2e-backend-videos
      - store_artifacts:
          path: test-results/e2e-backend-results.json
          destination: e2e-backend-results.json

  noctalia-e2e-web:
    executor: node
    # One Metro worker per container; shards split the serial suite by test.
    parallelism: 3
    steps:
      - install-root-dependencies:
          save_cache: false
      - run:
          name: Install Chromium and browser dependencies
          command: npx playwright install --with-deps chromium
      - run:
          name: Verify guest, free and Plus user journeys with isolated mock services
          command: npm run test:e2e:web -- --shard="$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}"
      - store_test_results:
          path: test-results/e2e-web-junit
      - store_artifacts:
          path: test-results/e2e-web-report
          destination: e2e-web-report
      - store_artifacts:
          path: test-results/e2e-web
          destination: e2e-web-traces

  testerarmy-web:
    executor: node
    parameters:
      product:
        type: enum
        enum: [dreamer, lucid, meditation]
      parallelism:
        type: integer
        default: 1
      contexts:
        description: primary shards the default context; dreamer-secondary runs the other Dreamer contexts.
        type: enum
        enum: [primary, dreamer-secondary]
        default: primary
      collect:
        description: Prove the campaign in this job; false hands the evidence to testerarmy-collect.
        type: boolean
        default: true
    parallelism: << parameters.parallelism >>
    environment:
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      EXPO_PUBLIC_ONBOARDING_FEATURE_SHEETS_ENABLED: "true"
      # Every container of one product shares a campaign, proven once by collect.
      E2E_CAMPAIGN_ID: << pipeline.id >>-<< parameters.product >>
    steps:
      - install-root-dependencies:
          save_cache: false
      - when:
          condition:
            equal: [meditation, << parameters.product >>]
          steps:
            - install-meditation-dependencies
      - install-testerarmy
      - when:
          condition:
            equal: [primary, << parameters.contexts >>]
          steps:
            - run:
                name: Verify exact << parameters.product >> browser journeys
                no_output_timeout: 30m
                command: |
                  node tools/e2e/run.mjs << parameters.product >> web run \
                    --shard "$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}" --trace
      - when:
          condition:
            equal: [dreamer-secondary, << parameters.contexts >>]
          steps:
            # Container 0 runs the 19 French journeys; container 1 the two short contexts.
            - run:
                name: Verify Dreamer historical French browser context
                command: |
                  if [[ "$CIRCLE_NODE_INDEX" == 0 ]]; then
                    E2E_WEB_LOCALE=fr-FR node tools/e2e/run.mjs dreamer web run --tag locale-fr-FR --trace
                  fi
            - run:
                name: Verify Dreamer historical German browser context
                command: |
                  if [[ "$CIRCLE_NODE_INDEX" == "$((CIRCLE_NODE_TOTAL - 1))" ]]; then
                    E2E_WEB_LOCALE=de-DE node tools/e2e/run.mjs dreamer web run --tag locale-de-DE --trace
                  fi
            - run:
                name: Verify Dreamer feature sheets remain disabled without opt-in
                command: |
                  if [[ "$CIRCLE_NODE_INDEX" == "$((CIRCLE_NODE_TOTAL - 1))" ]]; then
                    EXPO_PUBLIC_ONBOARDING_FEATURE_SHEETS_ENABLED=false E2E_WEB_LOCALE=en-US node tools/e2e/run.mjs dreamer web run --grep 'feature sheets stay disabled by default' --trace
                  fi
      - when:
          condition: << parameters.collect >>
          steps:
            - run:
                name: Verify the exact passed-ID union and all browser contexts
                when: always
                command: node tools/e2e/run.mjs << parameters.product >> web collect
      - store_test_results:
          path: tools/e2e/.e2e
      - store_artifacts:
          path: tools/e2e/.e2e
          destination: testerarmy
      - unless:
          condition: << parameters.collect >>
          steps:
            # Only a successful container hands its finalized evidence to the collector.
            - persist_to_workspace:
                root: tools/e2e
                paths:
                  - .e2e/<< parameters.product >>-web

  testerarmy-collect:
    docker:
      - image: cimg/node:24.19.0
    resource_class: small
    parameters:
      product:
        type: enum
        enum: [dreamer]
    environment:
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      E2E_CAMPAIGN_ID: << pipeline.id >>-<< parameters.product >>
    steps:
      - checkout
      - attach_workspace:
          at: tools/e2e
      - run:
          name: Install isolated locked TesterArmy e2e 0.18.0 dependencies
          command: npm run test:testerarmy:setup
      - run:
          name: Verify the exact passed-ID union and all browser contexts
          command: node tools/e2e/run.mjs << parameters.product >> web collect
      # The runs already stored their traces; keep only the collection receipts.
      - run:
          name: Select the collection receipts
          when: always
          command: |
            mkdir -p /tmp/testerarmy-campaign
            for run in tools/e2e/.e2e/<< parameters.product >>-web/*/; do
              if grep -q '"collect"' "$run/evidence.json" 2>/dev/null; then cp -R "$run" /tmp/testerarmy-campaign/; fi
            done
      - store_artifacts:
          path: /tmp/testerarmy-campaign
          destination: testerarmy-campaign

  noctalia-quality:
    executor: node
    parameters:
      run_changed_tests:
        type: boolean
        default: false
      run_full_tests:
        type: boolean
        default: false
      diff_base:
        type: string
        default: ""
      require_timing_baseline:
        type: boolean
        default: false
      publish_timing_baseline:
        type: boolean
        default: false
    steps:
      - install-root-dependencies
      - run:
          name: Check Dreamer and Lucid Expo SDK dependency compatibility
          environment:
            EXPO_OFFLINE: "1"
          command: npm run dependencies:check
      - run:
          name: Verify product import boundaries
          command: npm run boundaries:check
      - run:
          name: Verify mobile version metadata
          command: node scripts/mobile-release.js verify --app all
      - run:
          name: Verify CI classification and Jest fallback
          command: |
            set -euo pipefail
            bash .circleci/tests/classify-changes.test.sh
            python3 .circleci/tests/shared-build-impact.test.py
            bash .circleci/tests/fallback-jest.test.sh
      - run:
          name: Typecheck Noctalia application
          command: npm run typecheck:app
      - run:
          name: Typecheck Noctalia tests
          command: npm run typecheck:tests
      - run:
          name: Lint Noctalia and root tooling
          command: npm run lint
      - run:
          name: Enforce warning-free active scripts
          command: npm run lint:scripts
      - when:
          condition: << parameters.run_changed_tests >>
          steps:
            - run:
                name: Test Noctalia files changed since the diff base
                environment:
                  JEST_CHANGED_SINCE: << parameters.diff_base >>
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
                  JEST_JUNIT_OUTPUT_DIR: artifacts/test-results
                  JEST_JUNIT_OUTPUT_NAME: jest.xml
                command: |
                  set -euo pipefail
                  if ! git cat-file -e "${JEST_CHANGED_SINCE}^{commit}" 2>/dev/null; then
                    git fetch --no-tags origin "$JEST_CHANGED_SINCE"
                  fi
                  mkdir -p artifacts/test-results
                  npm run test:changed -- \
                    --json \
                    --outputFile=artifacts/jest-results.json \
                    --reporters=default \
                    --reporters=jest-junit
            - store_artifacts:
                path: artifacts/jest-results.json
                destination: noctalia-jest-timing/jest-results.json
            - store_test_results:
                path: artifacts/test-results
            - store_artifacts:
                path: artifacts/test-results
                destination: test-results/noctalia
      - when:
          condition: << parameters.run_full_tests >>
          steps:
            - when:
                condition: << parameters.require_timing_baseline >>
                steps:
                  - restore_cache:
                      keys:
                        - jest-timing-master-v1-
            - run:
                name: Run full Noctalia Jest suite and capture timing JSON
                environment:
                  JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
                  JEST_JUNIT_OUTPUT_DIR: artifacts/test-results
                  JEST_JUNIT_OUTPUT_NAME: jest.xml
                command: |
                  mkdir -p artifacts/test-results
                  npm run test:fast -- \
                    --json \
                    --outputFile=artifacts/jest-results.json \
                    --reporters=default \
                    --reporters=jest-junit
            - run:
                name: Enforce the 20% duration budget or bootstrap the baseline
                when: always
                command: |
                  if [[ -f artifacts/jest-results.json ]]; then
                    node ./scripts/check-jest-duration-regression.js --allow-missing-baseline
                  fi
            - when:
                condition: << parameters.publish_timing_baseline >>
                steps:
                  - run:
                      name: Prepare successful master timing baseline
                      command: |
                        mkdir -p artifacts/baseline
                        cp artifacts/jest-results.json artifacts/baseline/jest-results.json
                  - save_cache:
                      key: jest-timing-master-v1-{{ epoch }}
                      paths:
                        - artifacts/baseline/jest-results.json
            - store_artifacts:
                path: artifacts/jest-results.json
                destination: noctalia-jest-timing/jest-results.json
            - store_test_results:
                path: artifacts/test-results
            - store_artifacts:
                path: artifacts/test-results
                destination: test-results/noctalia

  meditation-quality:
    executor: node
    steps:
      - install-meditation-dependencies
      - run:
          name: Check Meditation Expo SDK dependency compatibility
          working_directory: apps/meditation
          environment:
            EXPO_OFFLINE: "1"
          command: npm run dependencies:check
      - run:
          name: Verify Meditation import boundaries
          command: node scripts/check-monorepo-boundaries.js --meditation
      - run:
          name: Typecheck Meditation application
          working_directory: apps/meditation
          command: npm run typecheck
      - run:
          name: Lint Meditation application
          working_directory: apps/meditation
          command: npm run lint
      - run:
          name: Test Meditation application with timing and JUnit
          working_directory: apps/meditation
          environment:
            JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
            JEST_JUNIT_OUTPUT_DIR: ../../artifacts/meditation/test-results
            JEST_JUNIT_OUTPUT_NAME: jest.xml
          command: |
            mkdir -p ../../artifacts/meditation/test-results
            npm test -- \
              --ci \
              --json \
              --outputFile=../../artifacts/meditation/jest-results.json \
              --reporters=default \
              --reporters=jest-junit
      - store_artifacts:
          path: artifacts/meditation/jest-results.json
          destination: meditation-jest-timing/jest-results.json
      - store_test_results:
          path: artifacts/meditation/test-results
      - store_artifacts:
          path: artifacts/meditation/test-results
          destination: test-results/meditation

  site-build:
    executor: node
    parameters:
      diff_base:
        type: string
        default: ""
      save_npm_cache:
        type: boolean
        default: false
    steps:
      - install-root-dependencies:
          save_cache: << parameters.save_npm_cache >>
      - run:
          name: Build site
          command: npm run docs:build
          no_output_timeout: 30m
      - run:
          name: Check site
          command: npm run docs:check
          no_output_timeout: 30m
      - install-testerarmy
      - run:
          name: Verify the generated site through TesterArmy
          command: npm run test:testerarmy:site
      - run:
          name: Verify the generated-site passed-ID union
          when: always
          command: node tools/e2e/run.mjs site web collect
      - store_test_results:
          path: tools/e2e/.e2e
      - store_artifacts:
          path: tools/e2e/.e2e
          destination: testerarmy-site
      # Noctalia runs the same root Jest portfolio (affected or exhaustive).
      # Keep site-only coverage, but do not execute that portfolio twice.
      - when:
          condition:
            not:
              and:
                - << pipeline.parameters.run_noctalia >>
                - or:
                    - << pipeline.parameters.run_changed_tests >>
                    - << pipeline.parameters.run_full_tests >>
          steps:
            - run:
                name: Test site tooling changed since the diff base
                environment:
                  JEST_CHANGED_SINCE: << parameters.diff_base >>
                command: |
                  set -euo pipefail
                  if [[ -n "$JEST_CHANGED_SINCE" ]] && \
                    ! git cat-file -e "${JEST_CHANGED_SINCE}^{commit}" 2>/dev/null; then
                    git fetch --no-tags origin "$JEST_CHANGED_SINCE"
                  fi
                  npm run test:changed -- --runInBand

  edge-functions:
    executor: node
    environment:
      DENO_DIR: /home/circleci/.cache/deno
      DENO_INSTALL: /home/circleci/.deno
    steps:
      - install-root-dependencies:
          save_cache: false
      - restore_cache:
          keys:
            - deno-2.7.14-v2-{{ checksum "supabase/functions/deno.lock" }}
      - run:
          name: Install Deno 2.7.14 when not cached
          command: |
            if [[ ! -x "$DENO_INSTALL/bin/deno" ]]; then
              curl -fsSL https://deno.land/install.sh | sh -s v2.7.14
            fi
            echo 'export PATH="$DENO_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            "$DENO_INSTALL/bin/deno" --version
      - run:
          name: Lint Edge Functions
          command: npx expo lint supabase/functions
      - run:
          name: Check Edge Function entrypoints
          working_directory: supabase/functions
          command: |
            deno check --frozen \
              api/index.ts \
              analysis-job-worker/index.ts \
              image-job-worker/index.ts \
              revenuecat-webhook/index.ts
      - run:
          name: Test analysis authorization and durable image failure migrations
          command: npm run test:analysis-authorization:db
      - run:
          name: Test Edge Functions
          working_directory: supabase/functions
          command: |
            mkdir -p ../../artifacts/test-results
            deno test \
              --frozen \
              --allow-env \
              --allow-net=deno.land \
              --allow-read=../migrations \
              --junit-path=../../artifacts/test-results/deno.xml \
              api \
              revenuecat-webhook
      - save_cache:
          key: deno-2.7.14-v2-{{ checksum "supabase/functions/deno.lock" }}
          paths:
            - /home/circleci/.cache/deno
            - /home/circleci/.deno
      - store_test_results:
          path: artifacts/test-results
      - store_artifacts:
          path: artifacts/test-results
          destination: test-results/edge

  edge-contracts:
    executor: node
    parameters:
      save_npm_cache:
        type: boolean
        default: false
    steps:
      - install-root-dependencies:
          save_cache: << parameters.save_npm_cache >>
      - run:
          name: Test static Supabase and Edge contracts
          environment:
            JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
            JEST_JUNIT_OUTPUT_DIR: artifacts/edge-contracts/test-results
            JEST_JUNIT_OUTPUT_NAME: jest.xml
          command: |
            mkdir -p artifacts/edge-contracts/test-results
            npm run test:file -- \
              scripts/check-db-contract.test.js \
              scripts/dream-images-auth-user-policy-migration.test.js \
              scripts/guest-chat-route-contract.test.js \
              scripts/guest-qa-passport-migration.test.js \
              scripts/interpretation-entitlement-migration.test.js \
              scripts/product-analytics-migration.test.js \
              scripts/product-analytics-schema-parity.test.js \
              --json \
              --outputFile=artifacts/edge-contracts/jest-results.json \
              --reporters=default \
              --reporters=jest-junit
      - store_artifacts:
          path: artifacts/edge-contracts/jest-results.json
          destination: edge-contract-timing/jest-results.json
      - store_test_results:
          path: artifacts/edge-contracts/test-results
      - store_artifacts:
          path: artifacts/edge-contracts/test-results
          destination: test-results/edge-contracts

  nothing-to-run:
    executor: base
    steps:
      - run:
          name: Confirm path-only no-op
          command: echo "No Noctalia, Meditation, site, Edge, or database contract checks are needed."

workflows:
  noctalia:
    when: << pipeline.parameters.run_noctalia >>
    jobs:
      - noctalia-quality:
          run_changed_tests: << pipeline.parameters.run_changed_tests >>
          run_full_tests: << pipeline.parameters.run_full_tests >>
          diff_base: << pipeline.parameters.diff_base >>
          require_timing_baseline: << pipeline.parameters.require_timing_baseline >>
          publish_timing_baseline: << pipeline.parameters.publish_timing_baseline >>
          filters:
            tags:
              only: /.*/
      - noctalia-e2e-web:
          filters:
            tags:
              only: /.*/
      - testerarmy-web:
          name: testerarmy-dreamer-journeys
          product: dreamer
          parallelism: 4
          collect: false
          filters:
            tags:
              only: /.*/
      - testerarmy-web:
          name: testerarmy-dreamer-contexts
          product: dreamer
          contexts: dreamer-secondary
          parallelism: 2
          collect: false
          filters:
            tags:
              only: /.*/
      - testerarmy-collect:
          name: testerarmy-dreamer
          product: dreamer
          requires:
            - testerarmy-dreamer-journeys
            - testerarmy-dreamer-contexts
          filters:
            tags:
              only: /.*/
      - testerarmy-web:
          name: testerarmy-lucid
          product: lucid
          filters:
            tags:
              only: /.*/

  backend-e2e:
    when:
      or:
        - << pipeline.parameters.run_noctalia >>
        - << pipeline.parameters.run_edge_contracts >>
    jobs:
      - noctalia-e2e-backend:
          filters:
            tags:
              only: /.*/

  meditation:
    when: << pipeline.parameters.run_meditation >>
    jobs:
      - meditation-quality:
          filters:
            tags:
              only: /.*/
      - testerarmy-web:
          name: testerarmy-meditation
          product: meditation
          filters:
            tags:
              only: /.*/

  site:
    when: << pipeline.parameters.run_site >>
    jobs:
      - site-build:
          diff_base: << pipeline.parameters.diff_base >>
          save_npm_cache: << pipeline.parameters.save_site_npm_cache >>
          filters:
            tags:
              only: /.*/

  edge-functions:
    when: << pipeline.parameters.run_edge_functions >>
    jobs:
      - edge-functions:
          filters:
            tags:
              only: /.*/

  edge-contracts:
    when: << pipeline.parameters.run_edge_contracts >>
    jobs:
      - edge-contracts:
          save_npm_cache: << pipeline.parameters.save_edge_contracts_npm_cache >>
          filters:
            tags:
              only: /.*/

  no-op:
    when:
      not:
        or:
          - << pipeline.parameters.run_noctalia >>
          - << pipeline.parameters.run_meditation >>
          - << pipeline.parameters.run_site >>
          - << pipeline.parameters.run_edge_functions >>
          - << pipeline.parameters.run_edge_contracts >>
    jobs:
      - nothing-to-run:
          filters:
            tags:
              only: /.*/
