version: 2.1

setup: true

parameters:
  force_full_validation:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  classify-and-continue:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout

      - run:
          name: Classify the pipeline
          command: |
            set -euo pipefail

            parameters_file=/tmp/circleci-parameters.json
            mode=pr
            base_revision=

            if [[ "<< pipeline.parameters.force_full_validation >>" == "true" && \
              "${CIRCLE_BRANCH:-}" == "master" ]]; then
              mode=full
            elif [[ "<< pipeline.parameters.force_full_validation >>" == "true" ]]; then
              mode=release
            elif [[ -n "${CIRCLE_TAG:-}" || "${CIRCLE_BRANCH:-}" == "release" || \
              "${CIRCLE_BRANCH:-}" == release/* ]]; then
              mode=release
            elif [[ "${CIRCLE_BRANCH:-}" == "master" ]]; then
              mode=main
              base_revision='<< pipeline.git.base_revision >>'

              if [[ "$base_revision" == "<nil>" ]]; then
                base_revision=
              fi

              if [[ -n "$base_revision" ]] && \
                ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
                if ! git fetch --no-tags origin "$base_revision"; then
                  echo "Unable to fetch the previous master pipeline revision; failing closed." >&2
                  base_revision=
                fi
              fi
            else
              git fetch --no-tags origin master:refs/remotes/origin/master
              base_revision="$(git merge-base "$CIRCLE_SHA1" origin/master || true)"
            fi

            .circleci/scripts/classify-changes.sh \
              "$mode" \
              "$base_revision" \
              "$CIRCLE_SHA1" \
              "$parameters_file"

            echo "Continuation parameters:"
            cat "$parameters_file"

      - continuation/continue:
          configuration_path: .circleci/continue.yml
          parameters: /tmp/circleci-parameters.json

workflows:
  # Remote CI runs only on demand, when any of these is true. Automatic webhook
  # pushes stay off and spend no credits; neither a merge nor a publish waits
  # for CircleCI. The routine proof is local: `npm run verify:pr` before merge,
  # `npm run verify:release` before a publish (AGENTS.md).
  # - pipeline.event.name is `api` (GitHub App manual web-app or API trigger):
  #   https://circleci.com/docs/guides/orchestrate/github-trigger-event-options/
  #   The orchestration cookbook says this value is GitHub App only:
  #   https://circleci.com/docs/guides/orchestrate/orchestration-cookbook/
  # - pipeline.trigger.type is `api` (legacy GitHub OAuth manual or API trigger,
  #   slug gh/thannous/dreamer). `github_oauth` is an automatic OAuth webhook
  #   and does not match. Reference:
  #   https://circleci.com/docs/reference/variables/
  #   That reference deprecates pipeline.trigger_source (2026-08-01) in favour
  #   of pipeline.trigger.type, so the gate no longer reads it.
  # - force_full_validation is true.
  setup:
    when:
      or:
        - equal: [api, << pipeline.event.name >>]
        - equal: [api, << pipeline.trigger.type >>]
        - equal: [true, << pipeline.parameters.force_full_validation >>]
    jobs:
      - classify-and-continue:
          filters:
            tags:
              only: /.*/
