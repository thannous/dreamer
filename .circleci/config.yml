version: 2.1

setup: true

parameters:
  force_full_validation:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  classify-and-continue:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout

      - run:
          name: Classify the pipeline
          command: |
            set -euo pipefail

            parameters_file=/tmp/circleci-parameters.json
            mode=pr
            base_revision=

            if [[ "<< pipeline.parameters.force_full_validation >>" == "true" && \
              "${CIRCLE_BRANCH:-}" == "master" ]]; then
              mode=full
            elif [[ "<< pipeline.parameters.force_full_validation >>" == "true" ]]; then
              mode=release
            elif [[ -n "${CIRCLE_TAG:-}" || "${CIRCLE_BRANCH:-}" == "release" || \
              "${CIRCLE_BRANCH:-}" == release/* ]]; then
              mode=release
            elif [[ "${CIRCLE_BRANCH:-}" == "master" ]]; then
              mode=main
              git fetch --no-tags --depth=2 origin master
              base_revision="$(git rev-parse "${CIRCLE_SHA1}^" 2>/dev/null || true)"
            else
              git fetch --no-tags origin master:refs/remotes/origin/master
              base_revision="$(git merge-base "$CIRCLE_SHA1" origin/master || true)"
            fi

            .circleci/scripts/classify-changes.sh \
              "$mode" \
              "$base_revision" \
              "$CIRCLE_SHA1" \
              "$parameters_file"

            echo "Continuation parameters:"
            cat "$parameters_file"

      - continuation/continue:
          configuration_path: .circleci/continue.yml
          parameters: /tmp/circleci-parameters.json

workflows:
  setup:
    jobs:
      - classify-and-continue:
          filters:
            tags:
              only: /.*/
