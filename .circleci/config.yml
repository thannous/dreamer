version: 2.1

parameters:
  run_e2e_benchmark:
    type: boolean
    default: false

jobs:
  e2e-chromium-benchmark:
    docker:
      - image: cimg/node:24.22.1
    resource_class: medium
    steps:
      - checkout
      # The benchmark installs only tools/e2e in disposable directories. No root
      # npm install, application suite, build, backend, cache or continuation.
      - run:
          name: Measure isolated E2E install and full versus headless Chromium
          command: npm run test:testerarmy:benchmark
          no_output_timeout: 15m
      - store_artifacts:
          path: .tmp/e2e-benchmark/results
          destination: e2e-chromium-benchmark

workflows:
  e2e-chromium-benchmark:
    when:
      and:
        - << pipeline.parameters.run_e2e_benchmark >>
        - or:
            - equal: [api, << pipeline.event.name >>]
            - equal: [api, << pipeline.trigger.type >>]
    jobs:
      - e2e-chromium-benchmark
